<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zyhawk ERP</title>
    <style>
      #app-loader {
        position: fixed; inset: 0;
        background: #f8fafc;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #app-loader.hidden { opacity: 0; pointer-events: none; }
      /* the logo's "Z" breathing inside a spinning ring — same as components/BrandLoader.jsx (index.css) */
      #app-loader .zy-mark { position: relative; display: grid; place-items: center; width: 99px; height: 99px; }
      #app-loader .zy-track { position: absolute; inset: 0; border-radius: 50%; border: 3px solid #e2e8f0; }
      #app-loader .zy-glow { position: absolute; inset: 18%; border-radius: 50%; background: radial-gradient(circle, rgba(34,211,238,.28), transparent 70%); animation: zy-glow 1.8s ease-in-out infinite; will-change: transform, opacity; }
      #app-loader .zy-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; border-top-color: #0ea5e9; border-right-color: #67e8f9; animation: zy-spin 1s linear infinite; will-change: transform; }
      #app-loader .zy-z { position: relative; display: inline-block; line-height: 1; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 900; font-size: 52px; background: linear-gradient(135deg, #0369a1 0%, #0ea5e9 35%, #67e8f9 55%, #0284c7 80%); -webkit-background-clip: text; background-clip: text; color: transparent; animation: zy-breathe 1.8s ease-in-out infinite; will-change: transform, opacity; }
      @keyframes zy-spin { to { transform: rotate(360deg); } }
      @keyframes zy-breathe { 0%, 100% { transform: scale(.9); opacity: .7; } 50% { transform: scale(1.04); opacity: 1; } }
      @keyframes zy-glow { 0%, 100% { transform: scale(.8); opacity: .35; } 50% { transform: scale(1.15); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #app-loader .zy-z, #app-loader .zy-glow { animation: none; } #app-loader .zy-ring { animation-duration: 3s; } }
    </style>
  </head>
  <body>
    <div id="app-loader">
      <div class="zy-mark" role="status" aria-label="Loading Zyhawk ERP">
        <span class="zy-track"></span><span class="zy-glow"></span><span class="zy-ring"></span><span class="zy-z" aria-hidden="true">Z</span>
      </div>
    </div>
    <script>
      // pin the first screen's animations to the page clock, like components/BrandLoader.jsx,
      // so the React loader that takes over carries on from here
      try { document.querySelector('#app-loader .zy-mark').getAnimations({ subtree: true }).forEach(function (x) { x.startTime = 0; }); } catch (e) {}
    </script>
    <div id="root"></div>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var observer = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            var loader = document.getElementById('app-loader');
            if (loader) {
              loader.classList.add('hidden');
              setTimeout(function() { loader.remove(); }, 350);
            }
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
